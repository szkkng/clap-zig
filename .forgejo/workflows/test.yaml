name: Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow_ref }}-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: codeberg-small
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: https://codeberg.org/mlugg/setup-zig@v2
      - run: zig build test
        working-directory: tests
